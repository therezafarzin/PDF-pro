name: PDFStudy
options:
  bundleIdPrefix: app.pdfstudy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  PDFStudy:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["*.md"]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: PDF Study
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "Copyright © 2026"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    entitlements:
      path: Resources/PDFStudy.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pdfstudy.PDFStudy
        PRODUCT_NAME: PDF Study
        PRODUCT_MODULE_NAME: PDFStudy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  PDFStudyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: PDFStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pdfstudy.PDFStudyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PDF Study.app/Contents/MacOS/PDF Study"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PDFStudy:
    build:
      targets:
        PDFStudy: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PDFStudyTests]
    archive:
      config: Release
